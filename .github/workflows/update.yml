name: Daten aktualisieren

on:
  schedule:
    # 10:47 und 19:07 Uhr Winterzeit (Compass veröffentlicht gegen 18 Uhr)
    - cron: "47 9 * * 1-5"
    - cron: "7 18 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compass-Werte abrufen
        run: python scripts/update.py
      - name: Aenderungen speichern
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data/updates.json
          git diff --cached --quiet || git commit -m "Daten aktualisiert $(date -u +%F)"
          git push
      - name: Website vorbereiten
        uses: actions/configure-pages@v5
      - name: Website hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Website veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
