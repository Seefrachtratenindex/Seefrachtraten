name: Daten aktualisieren

on:
  schedule:
    # Werktags 09:47 UTC = 10:47 Uhr deutscher Winterzeit (11:47 Uhr Sommerzeit)
    - cron: "47 9 * * 1-5"
  workflow_dispatch: {}   # erlaubt manuellen Start ueber "Run workflow"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compass-Werte abrufen
        run: python scripts/update.py
      - name: Aenderungen speichern
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data/updates.json
          git diff --cached --quiet || git commit -m "Daten aktualisiert $(date -u +%F)"
          git push
